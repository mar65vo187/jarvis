name: Jarvis checks and download
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q jarvis Jarvis.pyw Jarvis-Oeffnen.pyw
      - name: Validate server scripts and dashboard script
        if: runner.os == 'Linux'
        run: |
          bash -n deploy/oracle/install.sh
          bash -n deploy/oracle/update.sh
          bash -n deploy/oracle/backup.sh
          python -c "import re;open('/tmp/hud.js','w').write(re.findall(r'<script>(.*?)</script>',open('hud/index.html',encoding='utf-8').read(),re.S)[0])"
          node --check /tmp/hud.js
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'windows/install.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
  download:
    needs: [tests, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS_READY
          path: dist/JARVIS_READY.zip
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --prefix .browser-check playwright@1.56.1
      - run: .browser-check/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-browser-check
          path: dist/browser-check/
