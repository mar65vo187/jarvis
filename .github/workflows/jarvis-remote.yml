name: Jarvis remote command

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      task:
        description: Auftrag fuer Jarvis
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  jarvis:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.actor == github.repository_owner && startsWith(github.event.comment.body, '/jarvis ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JARVIS_LOCAL: "0"
      DATA_DIR: ${{ runner.temp }}/jarvis-data
      JARVIS_ENV_FILE: ${{ runner.temp }}/jarvis.env
      JARVIS_PROVIDER: auto
      JARVIS_CLOUD_ENABLED: "1"
      JARVIS_AGENT_USE_OLLAMA: "0"
      JARVIS_UPGRADE_AUTO: "0"
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare task
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.comment.body }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/jarvis-task.txt"
          else
            printf '%s' "$MANUAL_TASK" > "$RUNNER_TEMP/jarvis-task.txt"
          fi
      - name: Run Jarvis remote brain
        shell: bash
        run: |
          JARVIS_REMOTE_TASK="$(cat "$RUNNER_TEMP/jarvis-task.txt")" python -m jarvis.github_remote > jarvis-response.txt
      - name: Reply to issue
        if: ${{ github.event_name == 'issue_comment' }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file jarvis-response.txt
      - name: Show manual result
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cat jarvis-response.txt >> "$GITHUB_STEP_SUMMARY"
